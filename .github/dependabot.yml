version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
  # Holder versjonene i .github/workflows/ (actions/checkout osv.) oppdatert.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
